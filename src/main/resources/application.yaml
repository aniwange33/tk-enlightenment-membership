springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  info:
    title: Taraku Enlightenment Club Membership API
    description: Membership management for the Taraku Enlightenment Club
    version: 0.0.1

notification:
  from: ${NOTIFICATION_FROM:noreply@taraku-enlightenment.org}

spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: postgres
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  application:
    name: membership
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      completion-mode: update
      republish-outstanding-events-on-restart: true
