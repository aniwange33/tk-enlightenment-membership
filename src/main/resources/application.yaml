springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs

notification:
  from: ${NOTIFICATION_FROM:noreply@taraku-enlightenment.org}
  # Base URL of the deployed app; used to build login and password-reset links in emails
  app-base-url: ${NOTIFICATION_APP_BASE_URL:http://localhost:8080}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    ttl: ${AUTH_JWT_TTL:PT8H}
  admin:
    email: ${AUTH_ADMIN_EMAIL:}
    password: ${AUTH_ADMIN_PASSWORD:}

spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: postgres
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  application:
    name: membership
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      completion-mode: update
      republish-outstanding-events-on-restart: true

# Observability: Micrometer + OpenTelemetry, exported over OTLP to Grafana (otel-lgtm).
# Point OTEL_OTLP_ENDPOINT at the collector; defaults to the local otel-lgtm container.
management:
  health:
    # SMTP reachability shouldn't flap app health/readiness (and it's a mock in tests)
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    git:
      mode: full
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    metrics:
      export:
        url: ${OTEL_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
    logging:
      endpoint: ${OTEL_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  opentelemetry:
    resource-attributes:
      service.namespace: taraku
      deployment.environment: ${DEPLOY_ENV:local}
